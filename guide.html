<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSV 내보내기 가이드 - 인바디 대시보드</title>
<style>
  :root {
    --primary-500: #FF6000;
    --primary-600: #CC4D00;
    --gray-100: #F3F4F6;
    --gray-200: #E5E7EA;
    --gray-300: #D1D6DC;
    --gray-400: #B1B8C0;
    --gray-500: #8A95A0;
    --gray-600: #6B7583;
    --gray-700: #4E5967;
    --gray-800: #333D4B;
    --gray-900: #191F28;
    --white: #FFFFFF;
    --border-weak: var(--gray-200);
    --border-normal: var(--gray-300);
    --font-main: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--gray-100); color: var(--gray-800); font-family: var(--font-main); }
  a { color: var(--primary-500); text-decoration: none; }
  button { font-family: var(--font-main); cursor: pointer; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }
  .back { font-size: 13px; color: var(--gray-600); display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; }
  h1 { margin: 0 0 6px; font-size: 28px; font-weight: 700; letter-spacing: -0.3px; color: var(--gray-900); }
  .lead { margin: 0 0 28px; font-size: 15px; color: var(--gray-600); line-height: 1.6; }

  .guide { display: grid; grid-template-columns: 340px 1fr; gap: 40px; align-items: start; }
  @media (max-width: 760px) {
    .guide { grid-template-columns: 1fr; }
  }

  .phone-col { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .phone {
    position: relative; width: 100%; max-width: 320px; aspect-ratio: 9 / 19.5;
    background: var(--gray-900); border-radius: 34px; padding: 10px;
    box-shadow: 0 20px 50px rgba(25, 31, 40, 0.18);
  }
  .phone-screen {
    position: relative; width: 100%; height: 100%; border-radius: 24px; overflow: hidden;
    background: var(--white);
  }
  .phone-screen img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity 0.35s ease;
  }
  .phone-screen img.active { opacity: 1; }
  .phone-screen .placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: 12px; color: var(--gray-500);
    background: var(--gray-100); opacity: 0; transition: opacity 0.35s ease;
  }
  .phone-screen .placeholder.active { opacity: 1; }

  .tap-dot {
    position: absolute; width: 30px; height: 30px; border-radius: 999px;
    background: rgba(255, 96, 0, 0.35); border: 2px solid var(--primary-500);
    transform: translate(-50%, -50%); pointer-events: none;
    animation: tapPulse 1.4s ease-out infinite;
  }
  .tap-dot::after {
    content: ""; position: absolute; inset: 0; margin: auto; width: 10px; height: 10px;
    border-radius: 999px; background: var(--primary-500);
  }
  @keyframes tapPulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 96, 0, 0.45); }
    70% { box-shadow: 0 0 0 18px rgba(255, 96, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 96, 0, 0); }
  }

  .scroll-cue {
    position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--primary-500); pointer-events: none;
  }
  .scroll-cue svg { animation: scrollBounce 1.2s ease-in-out infinite; }
  @keyframes scrollBounce {
    0%, 100% { transform: translateY(0); opacity: 0.5; }
    50% { transform: translateY(8px); opacity: 1; }
  }

  .progress-dots { display: flex; gap: 6px; }
  .progress-dots span {
    width: 7px; height: 7px; border-radius: 999px; background: var(--gray-300);
  }
  .progress-dots span.active { background: var(--primary-500); }

  .nav-row { display: flex; align-items: center; gap: 10px; }
  .nav-btn {
    border: 1px solid var(--border-normal); background: var(--white); color: var(--gray-700);
    font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 8px;
  }
  .nav-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .nav-btn.primary { background: var(--primary-500); color: #fff; border-color: var(--primary-500); }
  .nav-btn.primary:hover { background: var(--primary-600); }

  .step-panel { display: flex; flex-direction: column; gap: 16px; padding-top: 4px; }
  .step-kicker { font-size: 13px; font-weight: 700; color: var(--primary-500); }
  .step-caption { font-size: 20px; font-weight: 700; color: var(--gray-900); line-height: 1.4; }
  .step-detail { font-size: 14px; color: var(--gray-600); line-height: 1.7; }
  .step-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .step-list button {
    text-align: left; border: 1px solid var(--border-weak); background: var(--white);
    border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--gray-700);
  }
  .step-list button.active { border-color: var(--primary-500); background: #FFF6EF; color: var(--gray-900); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .tap-dot, .scroll-cue svg { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="dashboard.html">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8.5 2.5L3.5 7l5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    대시보드로
  </a>
  <h1>CSV는 어떻게 받나요</h1>
  <p class="lead">인바디 앱에서 전체 측정 기록을 CSV로 내보내는 방법을 순서대로 따라해보세요.</p>

  <div class="guide">
    <div class="phone-col">
      <div class="phone">
        <div class="phone-screen" id="phoneScreen">
          <!-- step images: drop files into gh-pages/guide-assets/ with these exact names -->
          <img data-step="0" src="guide-assets/inbody_1.PNG" alt="대시보드 화면">
          <img data-step="1" src="guide-assets/inbody_2.PNG" alt="상세 탭 화면">
          <img data-step="2" src="guide-assets/inbody_3.PNG" alt="데이터 내보내기 메뉴">
          <img data-step="3" src="guide-assets/inbody_4.PNG" alt="기간 선택 화면">
          <img data-step="4" src="guide-assets/inbody_5.PNG" alt="전체 선택 화면">
          <img data-step="5" src="guide-assets/inbody_6.PNG" alt="내보내기 화면">
          <div id="tapLayer"></div>
        </div>
      </div>
      <div class="progress-dots" id="progressDots"></div>
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn">이전</button>
        <button class="nav-btn primary" id="nextBtn">다음</button>
      </div>
    </div>

    <div class="step-panel">
      <div class="step-kicker" id="stepKicker"></div>
      <div class="step-caption" id="stepCaption"></div>
      <div class="step-detail" id="stepDetail"></div>
      <div class="step-list" id="stepList"></div>
    </div>
  </div>
</div>

<script>
  var STEPS = [
    {
      kicker: "1단계",
      caption: "상단 탭에서 '상세'를 눌러주세요",
      detail: "대시보드 화면 위쪽 탭 중 '상세'를 누르면 이번 측정의 자세한 항목을 볼 수 있어요.",
      tap: { xPct: 38, yPct: 17 }
    },
    {
      kicker: "2단계",
      caption: "화면을 아래로 내려주세요",
      detail: "상세 화면 아래쪽에 '데이터 내보내기' 메뉴가 있어요. 스크롤해서 내려가주세요.",
      scroll: true
    },
    {
      kicker: "3단계",
      caption: "'데이터 내보내기'를 눌러주세요",
      detail: "메뉴 목록에서 가장 위에 있는 '데이터 내보내기'를 눌러주세요.",
      tap: { xPct: 50, yPct: 60 }
    },
    {
      kicker: "4단계",
      caption: "기본으로 '기간'이 선택되어 있어요",
      detail: "이 상태로 내보내면 지정된 기간의 기록만 받아져요. 대시보드에서 전체 추이를 보려면 처음 측정부터 지금까지 전체 기록이 필요해요. '전체'를 눌러주세요.",
      tap: { xPct: 26, yPct: 35 }
    },
    {
      kicker: "4단계",
      caption: "'전체'가 선택됐어요",
      detail: "이제 처음 측정부터 지금까지 모든 기록이 포함돼요. 이 상태로 다음 단계로 넘어가세요.",
    },
    {
      kicker: "5단계",
      caption: "아래로 스크롤한 다음 '내보내기'를 눌러주세요",
      detail: "화면 아래로 내리면 '내보내기' 버튼이 보여요. 눌러서 CSV 파일을 받으세요. 받은 파일을 대시보드 업로드 버튼으로 올리면 끝이에요.",
      scroll: true,
      tap: { xPct: 50, yPct: 93 }
    }
  ];

  var current = 0;

  function render() {
    document.querySelectorAll(".phone-screen img").forEach(function (img) {
      var isActive = parseInt(img.dataset.step, 10) === current;
      img.classList.toggle("active", isActive);
      img.onerror = function () {
        var existing = img.nextElementSibling;
        if (existing && existing.classList && existing.classList.contains("placeholder")) {
          existing.classList.toggle("active", isActive);
          return;
        }
        var ph = document.createElement("div");
        ph.className = "placeholder" + (isActive ? " active" : "");
        ph.dataset.step = img.dataset.step;
        ph.textContent = img.getAttribute("src") + " 이미지를 추가해주세요";
        img.insertAdjacentElement("afterend", ph);
      };
    });
    document.querySelectorAll(".placeholder").forEach(function (ph) {
      ph.classList.toggle("active", parseInt(ph.dataset.step, 10) === current);
    });

    var step = STEPS[current];
    var tapLayer = document.getElementById("tapLayer");
    tapLayer.innerHTML = "";
    if (step.tap) {
      var dot = document.createElement("div");
      dot.className = "tap-dot";
      dot.style.left = step.tap.xPct + "%";
      dot.style.top = step.tap.yPct + "%";
      tapLayer.appendChild(dot);
    }
    if (step.scroll) {
      var cue = document.createElement("div");
      cue.className = "scroll-cue";
      cue.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      tapLayer.appendChild(cue);
    }

    document.getElementById("stepKicker").textContent = step.kicker;
    document.getElementById("stepCaption").textContent = step.caption;
    document.getElementById("stepDetail").textContent = step.detail;

    var dotsEl = document.getElementById("progressDots");
    dotsEl.innerHTML = STEPS.map(function (s, i) {
      return '<span class="' + (i === current ? "active" : "") + '"></span>';
    }).join("");

    var listEl = document.getElementById("stepList");
    listEl.innerHTML = STEPS.map(function (s, i) {
      return '<button data-goto="' + i + '" class="' + (i === current ? "active" : "") + '">' + (i + 1) + ". " + s.caption + "</button>";
    }).join("");

    document.getElementById("prevBtn").disabled = current === 0;
    document.getElementById("nextBtn").textContent = current === STEPS.length - 1 ? "완료" : "다음";
  }

  document.getElementById("prevBtn").addEventListener("click", function () {
    if (current > 0) { current -= 1; render(); }
  });
  document.getElementById("nextBtn").addEventListener("click", function () {
    if (current < STEPS.length - 1) { current += 1; render(); }
    else { window.location.href = "dashboard.html"; }
  });
  document.getElementById("stepList").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-goto]");
    if (!btn) return;
    current = parseInt(btn.dataset.goto, 10);
    render();
  });

  render();
</script>
</body>
</html>
