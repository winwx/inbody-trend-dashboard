<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인바디 대시보드</title>
<style>
  :root {
    --primary-500: #FF6000;
    --primary-600: #CC4D00;
    --primary-50: #FFEFE5;
    --gray-100: #F3F4F6;
    --gray-200: #E5E7EA;
    --gray-300: #D1D6DC;
    --gray-400: #B1B8C0;
    --gray-500: #8A95A0;
    --gray-600: #6B7583;
    --gray-700: #4E5967;
    --gray-800: #333D4B;
    --gray-900: #191F28;
    --white: #FFFFFF;
    --bg-normal: var(--gray-100);
    --bg-primary-weak: var(--primary-50);
    --border-normal: var(--gray-300);
    --border-weak: var(--gray-200);
    --success: oklch(0.60 0.14 150);
    --danger: oklch(0.58 0.19 20);
    --font-main: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg-normal); }
  body { font-family: var(--font-main); color: var(--gray-800); }
  a { color: var(--primary-500); text-decoration: none; }
  a:hover { color: var(--primary-600); }
  input[type="date"] { font-family: var(--font-main); }
  #dropzone { transition: border-color 0.15s ease, background 0.15s ease; }
  #dropzone.drag { border-color: var(--primary-500) !important; background: var(--bg-primary-weak); }
  button { font-family: var(--font-main); cursor: pointer; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; white-space: nowrap; }
  thead th { position: sticky; top: 0; background: var(--white); border-bottom: 1px solid var(--border-normal); color: var(--gray-600); font-weight: 600; }
  tbody tr { border-bottom: 1px solid var(--border-weak); }
  tbody tr:last-child { border-bottom: none; }
</style>
</head>
<body>
<div id="app" style="width:100%; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding: 32px 20px 64px;"></div>

<script>
(function () {
  "use strict";

  var ACCENT = "#FF6000";

  var METRIC_DEFS = [
    { key: "weight", label: "체중", unit: "kg", good: "neutral", decimals: 1, color: "#FF6000" },
    { key: "skeletal", label: "골격근량", unit: "kg", good: "up", decimals: 1, color: "oklch(0.60 0.15 200)" },
    { key: "fatMass", label: "체지방량", unit: "kg", good: "down", decimals: 1, color: "oklch(0.56 0.16 265)" },
    { key: "fatPct", label: "체지방률", unit: "%", good: "down", decimals: 1, color: "oklch(0.58 0.17 325)" },
    { key: "bmi", label: "BMI", unit: "", good: "down", decimals: 1, color: "oklch(0.52 0.13 115)" },
    { key: "score", label: "인바디점수", unit: "점", good: "up", decimals: 0, color: "oklch(0.55 0.17 290)" }
  ];

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function toNum(v) {
    if (v === undefined || v === null) return null;
    var s = ("" + v).trim();
    if (s === "" || s === "-") return null;
    var n = parseFloat(s);
    return isNaN(n) ? null : n;
  }

  function fmtDateLabel(d) {
    if (!d || d.length < 8) return d || "";
    return d.slice(0, 4) + "." + d.slice(4, 6) + "." + d.slice(6, 8);
  }

  function fmtDateFull(d) {
    if (!d || d.length < 12) return fmtDateLabel(d);
    return d.slice(0, 4) + "-" + d.slice(4, 6) + "-" + d.slice(6, 8) + " " + d.slice(8, 10) + ":" + d.slice(10, 12);
  }

  function toDateObj(d14) {
    if (!d14 || d14.length < 8) return null;
    return new Date(parseInt(d14.slice(0, 4), 10), parseInt(d14.slice(4, 6), 10) - 1, parseInt(d14.slice(6, 8), 10));
  }

  function toISODate(dateObj) {
    var y = dateObj.getFullYear();
    var m = ("0" + (dateObj.getMonth() + 1)).slice(-2);
    var d = ("0" + dateObj.getDate()).slice(-2);
    return y + "-" + m + "-" + d;
  }

  function parseCSV(text) {
    var lines = ("" + text).split(/\r?\n/).filter(function (l) { return l.trim().length > 0; });
    if (lines.length < 2) return { error: true };
    var headers = lines[0].split(",").map(function (h) { return h.trim(); });
    function idx(name) { return headers.indexOf(name); }
    var iDate = idx("날짜"), iDevice = idx("측정장비"), iWeight = idx("체중(kg)"),
        iSkeletal = idx("골격근량(kg)"), iFatMass = idx("체지방량(kg)"),
        iBmi = headers.findIndex(function (h) { return h.indexOf("BMI") === 0; }),
        iFatPct = idx("체지방률(%)"), iScore = idx("인바디점수");
    if (iDate < 0 || iWeight < 0) return { error: true };
    var records = lines.slice(1).map(function (line) {
      var cols = line.split(",");
      var date = cols[iDate] ? cols[iDate].trim() : "";
      if (!date) return null;
      return {
        date: date,
        device: cols[iDevice] ? cols[iDevice].trim() : "-",
        weight: toNum(cols[iWeight]),
        skeletal: iSkeletal >= 0 ? toNum(cols[iSkeletal]) : null,
        fatMass: iFatMass >= 0 ? toNum(cols[iFatMass]) : null,
        bmi: iBmi >= 0 ? toNum(cols[iBmi]) : null,
        fatPct: iFatPct >= 0 ? toNum(cols[iFatPct]) : null,
        score: iScore >= 0 ? toNum(cols[iScore]) : null
      };
    }).filter(function (r) { return r !== null; });
    records.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    return { records: records };
  }

  var state = {
    records: [], selectedMetrics: ["weight"], deviceFilter: "all",
    dateFrom: "", dateTo: "", datePreset: null, error: null, fileName: null
  };

  function setState(patch) { Object.assign(state, patch); render(); }

  function fmtVal(def, val) {
    if (val === null || val === undefined) return "—";
    return val.toFixed(def.decimals) + def.unit;
  }

  function buildKpi(def, records) {
    var withVal = records.filter(function (r) { return r[def.key] !== null; });
    if (withVal.length === 0) {
      return { label: def.label, valueText: "—", deltaText: "데이터 없음", isUp: false, isDown: false, isFlat: false, deltaColor: "var(--gray-500)" };
    }
    var latest = withVal[withVal.length - 1];
    var valueText = fmtVal(def, latest[def.key]);
    if (withVal.length < 2) {
      return { label: def.label, valueText: valueText, deltaText: "이전 기록 없음", isUp: false, isDown: false, isFlat: false, deltaColor: "var(--gray-500)" };
    }
    var prev = withVal[withVal.length - 2];
    var diff = latest[def.key] - prev[def.key];
    var dir = diff > 0.05 ? "up" : diff < -0.05 ? "down" : "flat";
    var color = "var(--gray-500)";
    if (def.good !== "neutral" && dir !== "flat") {
      var isGood = (dir === "up" && def.good === "up") || (dir === "down" && def.good === "down");
      color = isGood ? "var(--success)" : "var(--danger)";
    }
    var sign = diff > 0 ? "+" : "";
    var deltaText = sign + diff.toFixed(def.decimals) + def.unit + " (직전 대비)";
    return {
      label: def.label, valueText: valueText, deltaText: deltaText,
      isUp: dir === "up", isDown: dir === "down", isFlat: dir === "flat",
      deltaColor: color
    };
  }

  function buildChart(selectedDefs, records) {
    var leftPad = 24, rightPad = 24, topPad = 34, bottomPad = 56;
    var chartW = 800, chartH = 300;
    var w = chartW - leftPad - rightPad, h = chartH - topPad - bottomPad;

    var dates = [];
    records.forEach(function (r) { if (dates.indexOf(r.date) === -1) dates.push(r.date); });
    var dateIndex = {};
    dates.forEach(function (d, i) { dateIndex[d] = i; });
    var xFor = function (d) {
      if (dates.length <= 1) return leftPad + w / 2;
      return leftPad + (dateIndex[d] / (dates.length - 1)) * w;
    };

    var isEmpty = selectedDefs.length === 0;
    var series = [];
    var legend = [];
    selectedDefs.forEach(function (def, sIdx) {
      var pts = records.filter(function (r) { return r[def.key] !== null; });
      var latestText = pts.length > 0 ? fmtVal(def, pts[pts.length - 1][def.key]) : "—";
      legend.push({ key: def.key, label: def.label, color: def.color, latestText: latestText });
      if (pts.length < 2) { series.push({ key: def.key, color: def.color, pathD: "", points: [] }); return; }
      var values = pts.map(function (p) { return p[def.key]; });
      var min = Math.min.apply(null, values);
      var max = Math.max.apply(null, values);
      if (min === max) { min = min - 1; max = max + 1; }
      var above = sIdx % 2 === 0;
      var points = pts.map(function (p, i) {
        var x = Math.round(xFor(p.date) * 10) / 10;
        var y = Math.round((topPad + (1 - (p[def.key] - min) / (max - min)) * h) * 10) / 10;
        var isLast = i === pts.length - 1;
        return {
          cx: x, cy: y, r: isLast ? 5 : 3,
          leftPct: Math.round((x / chartW) * 1000) / 10,
          topPct: Math.round((y / chartH) * 1000) / 10,
          labelTransform: above ? "translate(-50%, -140%)" : "translate(-50%, 40%)",
          valueText: p[def.key].toFixed(def.decimals) + def.unit,
          tooltip: fmtDateLabel(p.date) + " · " + def.label + " " + p[def.key].toFixed(def.decimals) + def.unit
        };
      });
      var pathD = "M" + points.map(function (p) { return p.cx + "," + p.cy; }).join(" L ");
      series.push({ key: def.key, color: def.color, pathD: pathD, points: points });
    });

    var dateLabels = dates.map(function (d) {
      var x = Math.round(xFor(d) * 10) / 10;
      var y = chartH - bottomPad + 16;
      return {
        leftPct: Math.round((x / chartW) * 1000) / 10,
        topPct: Math.round((y / chartH) * 1000) / 10,
        text: fmtDateLabel(d)
      };
    });

    var baselineY = chartH - bottomPad;
    var rangeText = dates.length > 0 ? (fmtDateLabel(dates[0]) + " ~ " + fmtDateLabel(dates[dates.length - 1])) : "데이터 없음";
    var anySeriesHasLine = series.some(function (s) { return s.points.length >= 2; });
    var hasEnough = !isEmpty && anySeriesHasLine;
    var notEnough = !isEmpty && !anySeriesHasLine;
    var minWidthPx = Math.max(640, dates.length * 70 + 80);

    return {
      isEmpty: isEmpty, hasEnough: hasEnough, notEnough: notEnough,
      rangeText: rangeText, legend: legend, series: series, dateLabels: dateLabels, baselineY: baselineY,
      minWidthPx: minWidthPx
    };
  }

  function chipStyle(active, color) {
    return active
      ? "background:" + color + ";color:#fff;border:1px solid " + color + ";border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;"
      : "background:var(--white);color:var(--gray-700);border:1px solid var(--border-normal);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;";
  }

  function smallChipStyle(active, color) {
    return active
      ? "background:" + color + ";color:#fff;border:1px solid " + color + ";border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;"
      : "background:var(--white);color:var(--gray-700);border:1px solid var(--border-normal);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;";
  }

  function render() {
    var allRecords = state.records || [];
    var devices = [];
    allRecords.forEach(function (r) { if (r.device && devices.indexOf(r.device) === -1) devices.push(r.device); });
    var deviceFilter = state.deviceFilter || "all";
    var byDevice = deviceFilter === "all" ? allRecords : allRecords.filter(function (r) { return r.device === deviceFilter; });

    var dateFrom = state.dateFrom || "";
    var dateTo = state.dateTo || "";
    var fromCompact = dateFrom ? dateFrom.replace(/-/g, "") : "";
    var toCompact = dateTo ? dateTo.replace(/-/g, "") : "";
    var records = byDevice.filter(function (r) {
      var d8 = r.date.slice(0, 8);
      if (fromCompact && d8 < fromCompact) return false;
      if (toCompact && d8 > toCompact) return false;
      return true;
    });

    var kpiCards = METRIC_DEFS.map(function (def) { return buildKpi(def, records); });
    var selectedMetrics = state.selectedMetrics || [];
    var selectedDefs = METRIC_DEFS.filter(function (d) { return selectedMetrics.indexOf(d.key) !== -1; });
    var chart = buildChart(selectedDefs, records);

    var sorted = records.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });

    var deviceChipsHtml = ['<button data-action="device" data-value="all" style="' + smallChipStyle(deviceFilter === "all", ACCENT) + '">전체</button>']
      .concat(devices.map(function (d) {
        return '<button data-action="device" data-value="' + escapeHtml(d) + '" style="' + smallChipStyle(deviceFilter === d, ACCENT) + '">' + escapeHtml(d) + '</button>';
      })).join("");

    var datePresetDefs = [{ months: "null", label: "전체" }, { months: "3", label: "3개월" }, { months: "6", label: "6개월" }, { months: "12", label: "1년" }];
    var datePreset = state.datePreset;
    var dateChipsHtml = datePresetDefs.map(function (opt) {
      var active = opt.months === "null" ? (datePreset === null) : (datePreset === parseInt(opt.months, 10));
      return '<button data-action="preset" data-value="' + opt.months + '" style="' + smallChipStyle(active, ACCENT) + '">' + opt.label + '</button>';
    }).join("");

    var kpiHtml = kpiCards.map(function (item) {
      var arrow = item.isUp
        ? '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 1 L9 8 L1 8 Z" fill="' + item.deltaColor + '"/></svg>'
        : item.isDown
        ? '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 9 L1 2 L9 2 Z" fill="' + item.deltaColor + '"/></svg>'
        : item.isFlat
        ? '<svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="4.5" width="8" height="1.4" fill="' + item.deltaColor + '"/></svg>'
        : '';
      return '<div style="background:var(--white); border:1px solid var(--border-weak); border-radius:12px; padding:16px 18px; display:flex; flex-direction:column; gap:8px;">' +
        '<div style="font-size:13px; color:var(--gray-600); font-weight:500;">' + item.label + '</div>' +
        '<div style="font-size:23px; font-weight:700; color:var(--gray-900); letter-spacing:-0.2px;">' + item.valueText + '</div>' +
        '<div style="display:flex; align-items:center; gap:4px; height:16px;">' + arrow +
        '<span style="font-size:12px; font-weight:600; color:' + item.deltaColor + ';">' + item.deltaText + '</span></div></div>';
    }).join("");

    var metricChipsHtml = METRIC_DEFS.map(function (def) {
      var active = selectedMetrics.indexOf(def.key) !== -1;
      return '<button data-action="metric" data-value="' + def.key + '" style="' + chipStyle(active, def.color) + '">' + def.label + '</button>';
    }).join("");

    var chartHtml = "";
    if (chart.hasEnough) {
      var legendHtml = chart.legend.map(function (item) {
        return '<div style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--gray-700);">' +
          '<span style="width:10px; height:10px; border-radius:999px; background:' + item.color + '; display:inline-block; flex-shrink:0;"></span>' +
          '<span style="font-weight:600;">' + item.label + '</span>' +
          '<span style="color:var(--gray-500);">' + item.latestText + '</span></div>';
      }).join("");

      var pathsHtml = chart.series.map(function (s) {
        var circles = s.points.map(function (p) {
          return '<circle cx="' + p.cx + '" cy="' + p.cy + '" r="' + p.r + '" fill="' + s.color + '" stroke="var(--white)" stroke-width="1.5"><title>' + escapeHtml(p.tooltip) + '</title></circle>';
        }).join("");
        return '<path d="' + s.pathD + '" fill="none" stroke="' + s.color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' + circles;
      }).join("");

      var valueLabelsHtml = chart.series.map(function (s) {
        return s.points.map(function (p) {
          return '<div style="position:absolute; left:' + p.leftPct + '%; top:' + p.topPct + '%; transform:' + p.labelTransform + '; font-size:11px; font-weight:700; color:' + s.color + '; white-space:nowrap;">' + p.valueText + '</div>';
        }).join("");
      }).join("");

      var dateLabelsHtml = chart.dateLabels.map(function (d) {
        return '<div style="position:absolute; left:' + d.leftPct + '%; top:' + d.topPct + '%; transform:translate(-100%, -50%) rotate(-40deg); transform-origin:right center; font-size:10px; color:var(--gray-500); white-space:nowrap;">' + d.text + '</div>';
      }).join("");

      chartHtml =
        '<div style="display:flex; flex-wrap:wrap; gap:16px;">' + legendHtml + '</div>' +
        '<div style="font-size:11px; color:var(--gray-400);">데이터가 많으면 그래프를 좌우로 스크롤해서 볼 수 있어요</div>' +
        '<div style="width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;">' +
        '<div style="position:relative; width:max(100%, ' + chart.minWidthPx + 'px); height:300px;">' +
        '<svg viewBox="0 0 800 300" preserveAspectRatio="none" style="width:100%; height:300px; display:block;">' +
        '<line x1="24" y1="' + chart.baselineY + '" x2="776" y2="' + chart.baselineY + '" stroke="var(--gray-200)" stroke-width="1"/>' +
        pathsHtml + '</svg>' +
        '<div style="position:absolute; inset:0; pointer-events:none;">' + valueLabelsHtml + dateLabelsHtml + '</div>' +
        '</div></div>';
    } else if (chart.notEnough) {
      chartHtml = '<div style="height:120px; display:flex; align-items:center; justify-content:center; color:var(--gray-500); font-size:13px; background:var(--bg-normal); border-radius:12px;">추세를 보려면 측정 기록이 2건 이상 필요해요</div>';
    } else if (chart.isEmpty) {
      chartHtml = '<div style="height:120px; display:flex; align-items:center; justify-content:center; color:var(--gray-500); font-size:13px; background:var(--bg-normal); border-radius:12px;">비교할 지표를 위 칩에서 선택해주세요</div>';
    }

    var tableRowsHtml = sorted.map(function (r) {
      return '<tr>' +
        '<td style="color:var(--gray-700);">' + fmtDateFull(r.date) + '</td>' +
        '<td><span style="display:inline-block; padding:3px 10px; border-radius:999px; background:var(--bg-primary-weak); color:var(--primary-500); font-size:11px; font-weight:600;">' + escapeHtml(r.device) + '</span></td>' +
        '<td>' + fmtVal(METRIC_DEFS[0], r.weight) + '</td>' +
        '<td>' + fmtVal(METRIC_DEFS[1], r.skeletal) + '</td>' +
        '<td>' + fmtVal(METRIC_DEFS[2], r.fatMass) + '</td>' +
        '<td>' + fmtVal(METRIC_DEFS[3], r.fatPct) + '</td>' +
        '<td>' + fmtVal(METRIC_DEFS[4], r.bmi) + '</td>' +
        '<td>' + fmtVal(METRIC_DEFS[5], r.score) + '</td>' +
        '</tr>';
    }).join("");

    var fileStatusText = state.fileName ? ("업로드됨: " + escapeHtml(state.fileName)) : "업로드된 CSV가 없어요";
    var errorHtml = state.error ? '<div style="font-size:12px; color:var(--danger);">' + escapeHtml(state.error) + '</div>' : '';

    var bodyHtml;
    if (allRecords.length === 0) {
      bodyHtml =
        '<div style="background:var(--white); border:1px solid var(--border-weak); border-radius:16px; padding:64px 24px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px;">' +
        '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" style="color:var(--gray-400);"><path d="M12 15V4m0 0L8 8m4-4l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
        '<div style="font-size:16px; font-weight:700; color:var(--gray-900);">아직 업로드된 데이터가 없어요</div>' +
        '<div style="font-size:14px; color:var(--gray-600); max-width:360px; line-height:1.6;">인바디에서 내보낸 CSV 파일을 위 업로드 영역으로 올리면 여기서 바로 추세를 확인할 수 있어요.</div>' +
        '</div>';
    } else {
      bodyHtml =
        '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px;">' +
        '<span style="font-size:13px; color:var(--gray-600); font-weight:500;">측정장비</span>' + deviceChipsHtml +
        '</div>' +
        '<div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px;">' +
        '<span style="font-size:13px; color:var(--gray-600); font-weight:500;">기간</span>' + dateChipsHtml +
        '<div style="display:flex; align-items:center; gap:6px; margin-left:2px;">' +
        '<input id="dateFromInput" type="date" value="' + dateFrom + '" style="min-width:132px; padding:6px 8px; font-size:12px; color:var(--gray-700); border:1px solid var(--border-normal); border-radius:8px; font-family:var(--font-main);" />' +
        '<span style="font-size:12px; color:var(--gray-500);">~</span>' +
        '<input id="dateToInput" type="date" value="' + dateTo + '" style="min-width:132px; padding:6px 8px; font-size:12px; color:var(--gray-700); border:1px solid var(--border-normal); border-radius:8px; font-family:var(--font-main);" />' +
        '</div></div>' +
        '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px;">' + kpiHtml + '</div>' +
        '<div style="background:var(--white); border:1px solid var(--border-weak); border-radius:16px; padding:24px; display:flex; flex-direction:column; gap:20px;">' +
        '<div style="display:flex; flex-wrap:wrap; gap:8px;">' + metricChipsHtml + '</div>' +
        '<div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px;">' +
        '<div style="font-size:16px; font-weight:600; color:var(--gray-900);">지표 비교 추이</div>' +
        '<div style="font-size:12px; color:var(--gray-500);">' + chart.rangeText + '</div></div>' +
        chartHtml +
        '</div>' +
        '<div style="background:var(--white); border:1px solid var(--border-weak); border-radius:16px; padding:24px; display:flex; flex-direction:column; gap:16px;">' +
        '<div style="display:flex; align-items:center; justify-content:space-between;">' +
        '<div style="font-size:16px; font-weight:600; color:var(--gray-900);">측정 이력</div>' +
        '<div style="font-size:12px; color:var(--gray-500);">' + records.length + '건의 측정 기록</div></div>' +
        '<div style="max-height:340px; overflow:auto; border:1px solid var(--border-weak); border-radius:12px;">' +
        '<table><thead><tr><th>측정일시</th><th>장비</th><th>체중</th><th>골격근량</th><th>체지방량</th><th>체지방률</th><th>BMI</th><th>인바디점수</th></tr></thead>' +
        '<tbody>' + tableRowsHtml + '</tbody></table></div></div>';
    }

    document.getElementById("app").innerHTML =
      '<div style="width:100%; max-width:1100px; display:flex; flex-direction:column; gap:24px;">' +
      '<a href="index.html" style="align-self:flex-start; font-size:13px; color:var(--gray-600); display:inline-flex; align-items:center; gap:6px;">' +
      '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8.5 2.5L3.5 7l5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>홈으로</a>' +
      '<div style="display:flex; flex-direction:column; gap:4px;">' +
      '<h1 style="margin:0; font-size:35px; font-weight:700; line-height:1.3; letter-spacing:-0.3px; color:var(--gray-900);">인바디 대시보드</h1>' +
      '<p style="margin:0; font-size:15px; color:var(--gray-600);">인바디 CSV를 업로드하면 측정 기록의 변화 추이를 확인할 수 있어요.</p>' +
      '</div>' +
      '<div style="background:var(--white); border:1px solid var(--border-weak); border-radius:16px; padding:24px; display:flex; flex-direction:column; gap:14px;">' +
      '<div id="dropzone" style="position:relative; border:2px dashed var(--border-normal); border-radius:12px; padding:28px 20px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;">' +
      '<input id="csvFile" type="file" accept=".csv" style="position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;" />' +
      '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" style="color:var(--gray-400);"><path d="M12 15V4m0 0L8 8m4-4l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
      '<div style="font-size:14px; font-weight:600; color:var(--gray-900);">CSV 파일을 여기로 드래그하거나 클릭해서 선택하세요</div>' +
      '<div style="font-size:12px; color:var(--gray-500);">' + fileStatusText + '</div>' +
      '</div>' + errorHtml +
      '<div style="display:flex; align-items:center; justify-content:flex-end; gap:10px;">' +
      '<a href="guide.html" style="text-decoration:none; background:var(--white); color:var(--gray-700); border:1px solid var(--border-normal); border-radius:8px; padding:10px 16px; font-size:13px; font-weight:600;">튜토리얼 보기</a>' +
      '<button data-action="reset" style="background:var(--white); color:var(--gray-700); border:1px solid var(--border-normal); border-radius:8px; padding:10px 16px; font-size:13px; font-weight:600;">데이터 지우기</button>' +
      '</div>' +
      '</div>' +
      bodyHtml +
      '</div>';

    wireEvents();
  }

  function pickDatePreset(monthsStr, referenceRecords) {
    if (monthsStr === "null") { setState({ dateFrom: "", dateTo: "", datePreset: null }); return; }
    var months = parseInt(monthsStr, 10);
    var ref = referenceRecords.length ? referenceRecords[referenceRecords.length - 1].date : null;
    var refDate = ref ? toDateObj(ref) : null;
    if (!refDate) { setState({ datePreset: months }); return; }
    refDate.setMonth(refDate.getMonth() - months);
    setState({ dateFrom: toISODate(refDate), dateTo: "", datePreset: months });
  }

  function wireEvents() {
    var app = document.getElementById("app");
    app.onclick = function (e) {
      var btn = e.target.closest("button[data-action]");
      if (!btn) return;
      var action = btn.dataset.action, value = btn.dataset.value;
      if (action === "device") {
        setState({ deviceFilter: value });
      } else if (action === "metric") {
        var cur = (state.selectedMetrics || []).slice();
        var i = cur.indexOf(value);
        if (i !== -1) cur.splice(i, 1); else cur.push(value);
        setState({ selectedMetrics: cur });
      } else if (action === "reset") {
        setState({ records: [], error: null, fileName: null, deviceFilter: "all", dateFrom: "", dateTo: "", datePreset: null });
      } else if (action === "preset") {
        var deviceFilter = state.deviceFilter || "all";
        var byDevice = deviceFilter === "all" ? state.records : state.records.filter(function (r) { return r.device === deviceFilter; });
        pickDatePreset(value, byDevice);
      }
    };
    var fileInput = document.getElementById("csvFile");
    if (fileInput) {
      fileInput.onchange = function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          var parsed = parseCSV(ev.target.result);
          if (parsed.error) {
            setState({ error: "CSV 형식을 확인해주세요. 인바디 내보내기 파일의 헤더 행이 포함되어 있는지 확인해주세요." });
            return;
          }
          setState({ records: parsed.records, error: null, fileName: file.name, deviceFilter: "all", dateFrom: "", dateTo: "", datePreset: null });
        };
        reader.readAsText(file, "utf-8");
      };
    }
    var dropzone = document.getElementById("dropzone");
    if (dropzone) {
      ["dragenter", "dragover"].forEach(function (evt) {
        fileInput.addEventListener(evt, function (e) { e.preventDefault(); dropzone.classList.add("drag"); });
      });
      ["dragleave", "drop"].forEach(function (evt) {
        fileInput.addEventListener(evt, function () { dropzone.classList.remove("drag"); });
      });
    }
    var dateFromInput = document.getElementById("dateFromInput");
    if (dateFromInput) dateFromInput.onchange = function (e) { setState({ dateFrom: e.target.value, datePreset: "custom" }); };
    var dateToInput = document.getElementById("dateToInput");
    if (dateToInput) dateToInput.onchange = function (e) { setState({ dateTo: e.target.value, datePreset: "custom" }); };
  }

  render();
})();
</script>
</body>
</html>
